<div class="auth">
  <aside class="brand-side" aria-label="KIDO">
    <div class="brand-glow" aria-hidden="true"></div>
    <a routerLink="/" class="brand-logo" aria-label="KIDO, ir al inicio">
      <app-logo [tamano]="44" [sobreOscuro]="true" />
    </a>

    <div class="pitch">
      <h2>{{ pitch().titulo }}</h2>
      <p>{{ pitch().texto }}</p>
      <ul>
        @for (p of pitch().puntos; track p.texto) {
          <li>
            <span class="dot"><app-icon [name]="p.icono" [size]="16" /></span>{{ p.texto }}
          </li>
        }
      </ul>
    </div>

    <!-- Credencial digital verificable -->
    <div class="showcase" aria-hidden="true">
      <div class="glass digital-credential">
        <div class="credential-head">
          <span class="credential-seal"><app-icon name="award" [size]="21" /></span>
          <span class="verified"><app-icon name="check" [size]="12" /> Verificado</span>
        </div>
        <strong>Certificado digital KIDO</strong>
        <p>Una credencial segura, verificable y lista para compartir.</p>
        <div class="credential-foot">
          <span><small>ID DE CREDENCIAL</small>KIDO · 7F3A · 2026</span>
          <span class="mini-qr" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
        </div>
      </div>
    </div>

    <p class="brand-foot">KIDO · Plataforma de cursos · UPeU</p>
  </aside>

  <section class="form-side">
    <div class="form-top">
      <a routerLink="/" class="mobile-logo" aria-label="KIDO, ir al inicio"
        ><app-logo [tamano]="34"
      /></a>
      <a routerLink="/cursos" class="back"><app-icon name="back" [size]="16" />Ver cursos</a>
      <button
        type="button"
        class="theme"
        (click)="visual.alternarTema()"
        [attr.aria-label]="visual.oscuro() ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro'"
      >
        <app-icon [name]="visual.oscuro() ? 'sun' : 'moon'" />
      </button>
    </div>
    <div class="form-body">
      <ng-content />
    </div>
  </section>
</div>
