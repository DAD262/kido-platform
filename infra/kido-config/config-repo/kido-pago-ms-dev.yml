server:
  port: 8083
spring:
  datasource:
    url: jdbc:postgresql://localhost:15435/kido_pago_db
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
kido:
  pagos:
    comision: 0.10
    dias-retencion: 7
    retiro-minimo: 50.00
    dias-reembolso: 7
    progreso-max-reembolso: 20
    permitir-simulacion: true
  mercadopago:
    access-token: ${MERCADO_PAGO_ACCESS_TOKEN:}
    notification-url: ${MERCADO_PAGO_NOTIFICATION_URL:}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
eureka:
  instance:
    hostname: localhost
    instance-id: ${spring.application.name}:${server.port}
  client:
    service-url:
      defaultZone: http://localhost:18761/eureka
