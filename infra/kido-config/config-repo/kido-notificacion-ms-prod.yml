server:
  port: 8080
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASS:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kido-kafka:9092}
    consumer:
      group-id: kido-notificacion-ms
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.value.default.type: pe.edu.upeu.notificacion.event.PagoAprobadoEvento
        spring.json.trusted.packages: pe.edu.upeu.notificacion.event
        spring.json.use.type.headers: false
kido:
  notificaciones:
    email-habilitado: ${SMTP_ENABLED:false}
    from: ${SMTP_FROM:no-reply@kido.local}
app:
  kafka:
    topic:
      pagos: kido-pago-eventos
      academico: kido-academico-eventos
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
eureka:
  instance:
    instance-id: ${spring.application.name}:${random.value}
  client:
    service-url:
      defaultZone: http://kido-eureka:8761/eureka
