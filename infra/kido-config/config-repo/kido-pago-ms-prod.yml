server:
  port: 8080
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
kido:
  pagos:
    comision: 0.10
    dias-retencion: 7
    retiro-minimo: 50.00
    dias-reembolso: 7
    progreso-max-reembolso: 20
    permitir-simulacion: false
  mercadopago:
    access-token: ${MERCADO_PAGO_ACCESS_TOKEN:}
    notification-url: ${MERCADO_PAGO_NOTIFICATION_URL:}
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
eureka:
  instance:
    instance-id: ${spring.application.name}:${random.value}
  client:
    service-url:
      defaultZone: http://kido-eureka:8761/eureka
