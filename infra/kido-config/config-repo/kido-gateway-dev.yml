server:
  port: 18080

spring:
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: kido-cursos
              uri: lb://kido-curso-ms
              predicates:
                - Path=/api/v1/cursos/**
            - id: kido-inscripciones
              uri: lb://kido-inscripcion-ms
              predicates:
                - Path=/api/v1/inscripciones/**

eureka:
  instance:
    hostname: localhost
    instance-id: ${spring.application.name}:${server.port}
  client:
    service-url:
      defaultZone: http://localhost:18761/eureka

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
