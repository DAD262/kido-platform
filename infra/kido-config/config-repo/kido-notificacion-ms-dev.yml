server:
  port: 8084
spring:
  datasource:
    url: jdbc:postgresql://localhost:15436/kido_notificacion_db
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  kafka:
    bootstrap-servers: localhost:19092
    consumer:
      group-id: kido-notificacion-ms
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.value.default.type: pe.edu.upeu.notificacion.event.PagoAprobadoEvento
        spring.json.trusted.packages: pe.edu.upeu.notificacion.event
        spring.json.use.type.headers: false
kido:
  notificaciones:
    email-habilitado: ${SMTP_ENABLED:false}
    from: ${SMTP_FROM:no-reply@kido.local}
app:
  kafka:
    topic:
      pagos: kido-pago-eventos
      academico: kido-academico-eventos
springdoc:
  swagger-ui:
    path: /swagger-ui.html
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
eureka:
  instance:
    hostname: localhost
    instance-id: ${spring.application.name}:${server.port}
  client:
    service-url:
      defaultZone: http://localhost:18761/eureka
