server:
  port: 8084
spring:
  datasource:
    url: jdbc:postgresql://localhost:15436/kido_notificacion_db
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
kido:
  notificaciones:
    email-habilitado: ${SMTP_ENABLED:false}
    from: ${SMTP_FROM:no-reply@kido.local}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
eureka:
  instance:
    hostname: localhost
    instance-id: ${spring.application.name}:${server.port}
  client:
    service-url:
      defaultZone: http://localhost:18761/eureka
