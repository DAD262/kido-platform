# Tema de login de KIDO.
# parent=base: se heredan las plantillas clásicas (estables entre versiones de Keycloak) y sus
# textos, pero NINGÚN CSS de PatternFly. Todo el aspecto sale de resources/css/kido.css y de
# template.ftl / login.ftl propios. Las demás pantallas (recuperar contraseña, errores, etc.)
# usan las plantillas de base dentro de nuestro template.ftl.
parent=base
locales=es,en
styles=css/kido.css
# Adónde llevan «Volver a KIDO» y «Crear cuenta» (el registro vive en la app Angular).
kidoAppUrl=http://localhost:4300

# Clases que usan las plantillas heredadas de base (los estilos están en kido.css).
kcFormGroupClass=kc-group
kcLabelClass=kc-label
kcInputClass=kc-input
kcInputErrorMessageClass=kc-error
kcButtonClass=kc-button
kcButtonPrimaryClass=kc-button-primary
kcButtonDefaultClass=kc-button-default
kcButtonBlockClass=kc-button-block
kcButtonLargeClass=
kcAlertClass=kc-alert
kcAlertTitleClass=kc-alert-title
kcFormOptionsWrapperClass=kc-options
kcFormPasswordVisibilityButtonClass=kc-eye
kcFormPasswordVisibilityIconShow=kc-eye-show
kcFormPasswordVisibilityIconHide=kc-eye-hide
kcInputGroup=kc-password
