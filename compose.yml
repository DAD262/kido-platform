name: kido-platform

services:
  kido-mailpit:
    image: axllent/mailpit:v1.31.5
    container_name: kido-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:18025:8025"
    environment:
      MP_DATABASE: /data/mailpit.db
    volumes: [kido_mailpit_data:/data]
    networks: [kido-net]

  kido-kafka:
    image: apache/kafka:4.3.1
    container_name: kido-kafka
    restart: unless-stopped
    ports:
      - "127.0.0.1:19092:19092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kido-kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kido-kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [kido-net]

  kido-kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    container_name: kido-kafka-ui
    restart: unless-stopped
    ports:
      - "127.0.0.1:18085:8080"
    depends_on:
      kido-kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: kido-dev
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kido-kafka:9092
    networks: [kido-net]

  postgres-keycloak:
    image: postgres:16-alpine
    container_name: kido-postgres-keycloak
    restart: unless-stopped
    environment:
      POSTGRES_DB: kido_keycloak
      POSTGRES_USER: kido_keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Define KEYCLOAK_DB_PASSWORD en .env}
    volumes: [kido_keycloak_postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kido_keycloak -d kido_keycloak"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [kido-net]

  kido-keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    container_name: kido-keycloak
    command: ["start-dev", "--import-realm"]
    depends_on:
      postgres-keycloak: {condition: service_healthy}
    ports:
      - "127.0.0.1:19090:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/kido_keycloak
      KC_DB_USERNAME: kido_keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Define KEYCLOAK_DB_PASSWORD en .env}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Define KEYCLOAK_ADMIN_PASSWORD en .env}
      # kido-realm.json usa esta variable como secreto del cliente kido-usuario-admin al importar el realm.
      KIDO_USUARIO_ADMIN_SECRET: ${KIDO_USUARIO_ADMIN_SECRET:?Define KIDO_USUARIO_ADMIN_SECRET en .env}
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
      - ./infra/keycloak/themes:/opt/keycloak/themes:ro
    networks: [kido-net]

  kido-config:
    build: ./infra/kido-config
    container_name: kido-config
    ports:
      - "127.0.0.1:${KIDO_CONFIG_PORT:-18889}:8888"
    environment:
      SERVER_PORT: 8888
      SPRING_PROFILES_ACTIVE: native
      CONFIG_REPO_LOCATION: file:/config-repo
    volumes:
      - ./infra/kido-config/config-repo:/config-repo:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8888' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [kido-net]

  kido-eureka:
    build: ./infra/kido-eureka
    container_name: kido-eureka
    ports:
      - "127.0.0.1:18761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CONFIG_SERVER_URL: http://kido-config:8888
    depends_on:
      kido-config:
        condition: service_healthy
    networks: [kido-net]

  postgres-curso:
    image: postgres:16-alpine
    container_name: kido-postgres-curso
    environment:
      POSTGRES_DB: kido_curso_db
      POSTGRES_USER: ${DB_USER:-kido}
      POSTGRES_PASSWORD: ${DB_PASS:?Copia .env.example como .env y define DB_PASS}
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-kido} -d kido_curso_db"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: [kido_curso_data:/var/lib/postgresql/data]
    networks: [kido-net]

  postgres-inscripcion:
    image: postgres:16-alpine
    container_name: kido-postgres-inscripcion
    environment:
      POSTGRES_DB: kido_inscripcion_db
      POSTGRES_USER: ${DB_USER:-kido}
      POSTGRES_PASSWORD: ${DB_PASS:?Copia .env.example como .env y define DB_PASS}
    ports:
      - "127.0.0.1:15434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-kido} -d kido_inscripcion_db"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: [kido_inscripcion_data:/var/lib/postgresql/data]
    networks: [kido-net]

  kido-curso-1:
    build: ./services/kido-curso-ms
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CONFIG_SERVER_URL: http://kido-config:8888
      DB_HOST: postgres-curso
      DB_PORT: 5432
      DB_NAME: kido_curso_db
      DB_USER: ${DB_USER:-kido}
      DB_PASS: ${DB_PASS:?Define DB_PASS en .env}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://kido-eureka:8761/eureka
    depends_on:
      postgres-curso: {condition: service_healthy}
      kido-eureka: {condition: service_started}
    volumes:
      - kido_materiales_data:/app/uploads
    networks: [kido-net]

  kido-curso-2:
    build: ./services/kido-curso-ms
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CONFIG_SERVER_URL: http://kido-config:8888
      DB_HOST: postgres-curso
      DB_PORT: 5432
      DB_NAME: kido_curso_db
      DB_USER: ${DB_USER:-kido}
      DB_PASS: ${DB_PASS:?Define DB_PASS en .env}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://kido-eureka:8761/eureka
    depends_on:
      postgres-curso: {condition: service_healthy}
      kido-eureka: {condition: service_started}
    volumes:
      - kido_materiales_data:/app/uploads
    networks: [kido-net]

  kido-inscripcion-ms:
    build: ./services/kido-inscripcion-ms
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CONFIG_SERVER_URL: http://kido-config:8888
      DB_HOST: postgres-inscripcion
      DB_PORT: 5432
      DB_NAME: kido_inscripcion_db
      DB_USER: ${DB_USER:-kido}
      DB_PASS: ${DB_PASS:?Define DB_PASS en .env}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://kido-eureka:8761/eureka
      KAFKA_BOOTSTRAP_SERVERS: kido-kafka:9092
      KIDO_SAGA_ESTUDIANTE_FALLO_DEMO: ${KIDO_SAGA_ESTUDIANTE_FALLO_DEMO:-0}
    depends_on:
      postgres-inscripcion: {condition: service_healthy}
      kido-kafka: {condition: service_healthy}
      kido-eureka: {condition: service_started}
    networks: [kido-net]


  postgres-pago:
    image: postgres:16-alpine
    container_name: kido-postgres-pago
    environment:
      POSTGRES_DB: kido_pago_db
      POSTGRES_USER: ${DB_USER:-kido}
      POSTGRES_PASSWORD: ${DB_PASS:?Define DB_PASS en .env}
    ports:
      - "127.0.0.1:15435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-kido} -d kido_pago_db"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: [kido_pago_data:/var/lib/postgresql/data]
    networks: [kido-net]

  postgres-usuario:
    image: postgres:16-alpine
    container_name: kido-postgres-usuario
    environment:
      POSTGRES_DB: kido_usuario_db
      POSTGRES_USER: ${DB_USER:-kido}
      POSTGRES_PASSWORD: ${DB_PASS:?Define DB_PASS en .env}
    ports:
      - "127.0.0.1:15437:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-kido} -d kido_usuario_db"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: [kido_usuario_data:/var/lib/postgresql/data]
    networks: [kido-net]

  # Identidad: registro estudiante/docente, perfil (/me) y verificación de docentes.
  kido-usuario-ms:
    build: ./services/kido-usuario-ms
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CONFIG_SERVER_URL: http://kido-config:8888
      DB_HOST: postgres-usuario
      DB_PORT: 5432
      DB_NAME: kido_usuario_db
      DB_USER: ${DB_USER:-kido}
      DB_PASS: ${DB_PASS:?Define DB_PASS en .env}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://kido-eureka:8761/eureka
      KEYCLOAK_JWK_SET_URI: http://kido-keycloak:8080/realms/kido/protocol/openid-connect/certs
      KEYCLOAK_SERVER_URL: http://kido-keycloak:8080
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://localhost:19090/realms/kido}
      KIDO_CATALOGO_BASE_URL: http://kido-curso-1:8080
      KIDO_USUARIO_ADMIN_SECRET: ${KIDO_USUARIO_ADMIN_SECRET:?Define KIDO_USUARIO_ADMIN_SECRET en .env}
      SPRING_MAIL_HOST: ${RECUPERACION_SMTP_HOST:-kido-mailpit}
      SPRING_MAIL_PORT: ${RECUPERACION_SMTP_PORT:-1025}
      SPRING_MAIL_USERNAME: ${RECUPERACION_SMTP_USER:-}
      SPRING_MAIL_PASSWORD: ${RECUPERACION_SMTP_PASS:-}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${RECUPERACION_SMTP_AUTH:-false}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${RECUPERACION_SMTP_TLS:-false}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_CONNECTIONTIMEOUT: 5000
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_TIMEOUT: 5000
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_WRITETIMEOUT: 5000
      KIDO_RECUPERACION_SECRET: ${KIDO_RECUPERACION_SECRET:?Define KIDO_RECUPERACION_SECRET en .env}
      KIDO_RECUPERACION_FROM: ${RECUPERACION_SMTP_FROM:-no-reply@kido.local}
      KIDO_RECUPERACION_APP_URL: ${KIDO_APP_URL:-http://localhost:4300}
    depends_on:
      kido-mailpit: {condition: service_started}
      postgres-usuario: {condition: service_healthy}
      kido-eureka: {condition: service_started}
      kido-keycloak: {condition: service_started}
    networks: [kido-net]

  postgres-notificacion:
    image: postgres:16-alpine
    container_name: kido-postgres-notificacion
    environment:
      POSTGRES_DB: kido_notificacion_db
      POSTGRES_USER: ${DB_USER:-kido}
      POSTGRES_PASSWORD: ${DB_PASS:?Define DB_PASS en .env}
    ports:
      - "127.0.0.1:15436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-kido} -d kido_notificacion_db"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: [kido_notificacion_data:/var/lib/postgresql/data]
    networks: [kido-net]

  kido-notificacion-ms:
    build: ./services/kido-notificacion-ms
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CONFIG_SERVER_URL: http://kido-config:8888
      DB_HOST: postgres-notificacion
      DB_PORT: 5432
      DB_NAME: kido_notificacion_db
      DB_USER: ${DB_USER:-kido}
      DB_PASS: ${DB_PASS:?Define DB_PASS en .env}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://kido-eureka:8761/eureka
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      SMTP_FROM: ${SMTP_FROM:-no-reply@kido.local}
      KAFKA_BOOTSTRAP_SERVERS: kido-kafka:9092
    depends_on:
      postgres-notificacion: {condition: service_healthy}
      kido-eureka: {condition: service_started}
      kido-kafka: {condition: service_healthy}
    networks: [kido-net]

  kido-pago-ms:
    build: ./services/kido-pago-ms
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CONFIG_SERVER_URL: http://kido-config:8888
      DB_HOST: postgres-pago
      DB_PORT: 5432
      DB_NAME: kido_pago_db
      DB_USER: ${DB_USER:-kido}
      DB_PASS: ${DB_PASS:?Define DB_PASS en .env}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://kido-eureka:8761/eureka
      KEYCLOAK_JWK_SET_URI: http://kido-keycloak:8080/realms/kido/protocol/openid-connect/certs
      MERCADO_PAGO_MODELO_RECAUDACION_CONFIRMADO: ${MERCADO_PAGO_MODELO_RECAUDACION_CONFIRMADO:-false}
      MERCADO_PAGO_AMBIENTE: ${MERCADO_PAGO_AMBIENTE:-pruebas}
      MERCADO_PAGO_ACCESS_TOKEN: ${MERCADO_PAGO_ACCESS_TOKEN:-}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://localhost:19090/realms/kido}
      MERCADO_PAGO_NOTIFICATION_URL: ${MERCADO_PAGO_NOTIFICATION_URL:-}
      MERCADO_PAGO_RETURN_URL: ${MERCADO_PAGO_RETURN_URL:-http://localhost:4300/pago/resultado}
      MERCADO_PAGO_AUTO_RETURN: ${MERCADO_PAGO_AUTO_RETURN:-false}
      MERCADO_PAGO_WEBHOOK_SECRET: ${MERCADO_PAGO_WEBHOOK_SECRET:-}
      KIDO_PAGOS_PERMITIR_SIMULACION: ${KIDO_PAGOS_PERMITIR_SIMULACION:-false}
      KAFKA_BOOTSTRAP_SERVERS: kido-kafka:9092
    depends_on:
      postgres-pago: {condition: service_healthy}
      kido-kafka: {condition: service_healthy}
      kido-eureka: {condition: service_started}
      kido-keycloak: {condition: service_started}
      kido-curso-1: {condition: service_started}
      kido-inscripcion-ms: {condition: service_started}
    networks: [kido-net]

  kido-gateway:
    build: ./infra/kido-gateway
    container_name: kido-gateway
    ports:
      - "127.0.0.1:18080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CONFIG_SERVER_URL: http://kido-config:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://kido-eureka:8761/eureka
      KEYCLOAK_JWK_SET_URI: http://kido-keycloak:8080/realms/kido/protocol/openid-connect/certs
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://localhost:19090/realms/kido}
    depends_on:
      kido-keycloak: {condition: service_started}
      kido-eureka: {condition: service_started}
      kido-curso-1: {condition: service_started}
      kido-curso-2: {condition: service_started}
      kido-inscripcion-ms: {condition: service_started}
      kido-pago-ms: {condition: service_started}
      kido-notificacion-ms: {condition: service_started}
      kido-usuario-ms: {condition: service_started}
    networks: [kido-net]


  kido-prometheus:
    image: prom/prometheus:v3.5.0
    container_name: kido-prometheus
    ports:
      - "127.0.0.1:19091:9090"
    volumes:
      - ./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks: [kido-net]

  kido-grafana:
    image: grafana/grafana:12.1.1
    container_name: kido-grafana
    ports:
      - "127.0.0.1:13000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Define GRAFANA_ADMIN_PASSWORD en .env}
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - kido-prometheus
    networks: [kido-net]

volumes:
  kido_mailpit_data:
  kido_keycloak_postgres_data:
  kido_curso_data:
  kido_inscripcion_data:
  kido_pago_data:
  kido_notificacion_data:
  kido_usuario_data:
  kido_materiales_data:

networks:
  kido-net:
    name: kido-net


