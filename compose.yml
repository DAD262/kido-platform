name: kido-platform

services:
  kido-keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    container_name: kido-keycloak
    command: ["start-dev", "--import-realm"]
    ports:
      - "19090:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    networks: [kido-net]

  kido-config:
    build: ./infra/kido-config
    container_name: kido-config
    ports:
      - "18888:8888"
    environment:
      SERVER_PORT: 8888
      SPRING_PROFILES_ACTIVE: native
      CONFIG_REPO_LOCATION: file:/config-repo
    volumes:
      - ./infra/kido-config/config-repo:/config-repo:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8888' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [kido-net]

  kido-eureka:
    build: ./infra/kido-eureka
    container_name: kido-eureka
    ports:
      - "18761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CONFIG_SERVER_URL: http://kido-config:8888
    depends_on:
      kido-config:
        condition: service_healthy
    networks: [kido-net]

  postgres-curso:
    image: postgres:16-alpine
    container_name: kido-postgres-curso
    environment:
      POSTGRES_DB: kido_curso_db
      POSTGRES_USER: ${DB_USER:-kido}
      POSTGRES_PASSWORD: ${DB_PASS:?Copia .env.example como .env y define DB_PASS}
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-kido} -d kido_curso_db"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: [kido_curso_data:/var/lib/postgresql/data]
    networks: [kido-net]

  postgres-inscripcion:
    image: postgres:16-alpine
    container_name: kido-postgres-inscripcion
    environment:
      POSTGRES_DB: kido_inscripcion_db
      POSTGRES_USER: ${DB_USER:-kido}
      POSTGRES_PASSWORD: ${DB_PASS:?Copia .env.example como .env y define DB_PASS}
    ports:
      - "15434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-kido} -d kido_inscripcion_db"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: [kido_inscripcion_data:/var/lib/postgresql/data]
    networks: [kido-net]

  kido-curso-1:
    build: ./services/kido-curso-ms
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CONFIG_SERVER_URL: http://kido-config:8888
      DB_HOST: postgres-curso
      DB_PORT: 5432
      DB_NAME: kido_curso_db
      DB_USER: ${DB_USER:-kido}
      DB_PASS: ${DB_PASS:?Define DB_PASS en .env}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://kido-eureka:8761/eureka
    depends_on:
      postgres-curso: {condition: service_healthy}
      kido-eureka: {condition: service_started}
    networks: [kido-net]

  kido-curso-2:
    build: ./services/kido-curso-ms
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CONFIG_SERVER_URL: http://kido-config:8888
      DB_HOST: postgres-curso
      DB_PORT: 5432
      DB_NAME: kido_curso_db
      DB_USER: ${DB_USER:-kido}
      DB_PASS: ${DB_PASS:?Define DB_PASS en .env}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://kido-eureka:8761/eureka
    depends_on:
      postgres-curso: {condition: service_healthy}
      kido-eureka: {condition: service_started}
    networks: [kido-net]

  kido-inscripcion-ms:
    build: ./services/kido-inscripcion-ms
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CONFIG_SERVER_URL: http://kido-config:8888
      DB_HOST: postgres-inscripcion
      DB_PORT: 5432
      DB_NAME: kido_inscripcion_db
      DB_USER: ${DB_USER:-kido}
      DB_PASS: ${DB_PASS:?Define DB_PASS en .env}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://kido-eureka:8761/eureka
    depends_on:
      postgres-inscripcion: {condition: service_healthy}
      kido-eureka: {condition: service_started}
    networks: [kido-net]


  postgres-pago:
    image: postgres:16-alpine
    container_name: kido-postgres-pago
    environment:
      POSTGRES_DB: kido_pago_db
      POSTGRES_USER: ${DB_USER:-kido}
      POSTGRES_PASSWORD: ${DB_PASS:?Define DB_PASS en .env}
    ports:
      - "15435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-kido} -d kido_pago_db"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: [kido_pago_data:/var/lib/postgresql/data]
    networks: [kido-net]

  postgres-notificacion:
    image: postgres:16-alpine
    container_name: kido-postgres-notificacion
    environment:
      POSTGRES_DB: kido_notificacion_db
      POSTGRES_USER: ${DB_USER:-kido}
      POSTGRES_PASSWORD: ${DB_PASS:?Define DB_PASS en .env}
    ports:
      - "15436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-kido} -d kido_notificacion_db"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: [kido_notificacion_data:/var/lib/postgresql/data]
    networks: [kido-net]

  kido-notificacion-ms:
    build: ./services/kido-notificacion-ms
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CONFIG_SERVER_URL: http://kido-config:8888
      DB_HOST: postgres-notificacion
      DB_PORT: 5432
      DB_NAME: kido_notificacion_db
      DB_USER: ${DB_USER:-kido}
      DB_PASS: ${DB_PASS:?Define DB_PASS en .env}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://kido-eureka:8761/eureka
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      SMTP_FROM: ${SMTP_FROM:-no-reply@kido.local}
    depends_on:
      postgres-notificacion: {condition: service_healthy}
      kido-eureka: {condition: service_started}
    networks: [kido-net]

  kido-pago-ms:
    build: ./services/kido-pago-ms
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CONFIG_SERVER_URL: http://kido-config:8888
      DB_HOST: postgres-pago
      DB_PORT: 5432
      DB_NAME: kido_pago_db
      DB_USER: ${DB_USER:-kido}
      DB_PASS: ${DB_PASS:?Define DB_PASS en .env}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://kido-eureka:8761/eureka
      MERCADO_PAGO_ACCESS_TOKEN: ${MERCADO_PAGO_ACCESS_TOKEN:-}
      MERCADO_PAGO_NOTIFICATION_URL: ${MERCADO_PAGO_NOTIFICATION_URL:-}
      KIDO_PAGOS_PERMITIR_SIMULACION: ${KIDO_PAGOS_PERMITIR_SIMULACION:-true}
    depends_on:
      postgres-pago: {condition: service_healthy}
      kido-eureka: {condition: service_started}
      kido-curso-1: {condition: service_started}
      kido-inscripcion-ms: {condition: service_started}
      kido-notificacion-ms: {condition: service_started}
    networks: [kido-net]

  kido-gateway:
    build: ./infra/kido-gateway
    container_name: kido-gateway
    ports:
      - "18080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CONFIG_SERVER_URL: http://kido-config:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://kido-eureka:8761/eureka
      KEYCLOAK_JWK_SET_URI: http://kido-keycloak:8080/realms/kido/protocol/openid-connect/certs
    depends_on:
      kido-keycloak: {condition: service_started}
      kido-eureka: {condition: service_started}
      kido-curso-1: {condition: service_started}
      kido-curso-2: {condition: service_started}
      kido-inscripcion-ms: {condition: service_started}
      kido-pago-ms: {condition: service_started}
      kido-notificacion-ms: {condition: service_started}
    networks: [kido-net]


  kido-prometheus:
    image: prom/prometheus:v3.5.0
    container_name: kido-prometheus
    ports:
      - "19091:9090"
    volumes:
      - ./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks: [kido-net]

  kido-grafana:
    image: grafana/grafana:12.1.1
    container_name: kido-grafana
    ports:
      - "13000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - kido-prometheus
    networks: [kido-net]

volumes:
  kido_curso_data:
  kido_inscripcion_data:
  kido_pago_data:
  kido_notificacion_data:

networks:
  kido-net:
    name: kido-net
